name: Git Test

on:
  push:

jobs:
  comment:
    runs-on: ubuntu-latest
    env:
      xyz: "hello"
    steps:
      - name: read env using dollar
        run: 'echo "dollar value is: $xyz"' # we are using single quote, because of colon(:)
      - name: read env using env scope
        run: echo "str value is ${{env.xyz}}"
